# Component images share this registry and the chart appVersion tag by default.
image:
  registry: ghcr.io/jradikk
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

driver: agent
datapath: iproute

agent:
  # Health/readiness listener in the agent Pod network namespace.
  healthPort: 19903
  # Node-local CRI socket exposed to the DaemonSet, not to workloads/gateways.
  criSocket: /run/containerd/containerd.sock
  resources: {}

# If set, must equal Helm's release namespace; admission TLS uses that namespace.
operatorNamespace: ""
clusterDomain: cluster.local
dns:
  # External DNS questions from dns.mode=gateway go through upstream0 only.
  # Replace when a VPN provider requires a different accessible resolver.
  upstreamIP: "1.1.1.1"
  # Operator-controlled tunnel-bound exit probe override. Empty retains the
  # plugin's default external HTTPS probe; only unicast IPv4 URLs are allowed.
  upstreamProbeURL: ""
fwmarkMask: "0x00f00000"

# CIDR overrides. Empty podCIDRs lets the controller discover Node PodCIDRs;
# extraCIDRs bypass the gateway.
exclusions:
  serviceCIDRs: []
  podCIDRs: []
  extraCIDRs: []

controller:
  replicas: 1
  # Required when replicas > 1; controller-runtime uses a namespaced Lease.
  leaderElection:
    enabled: false
  resources: {}
webhook:
  # Webhook replicas share one TLS Secret and use the same CA bundle.
  replicas: 1
  resources: {}

# Limit inbound ports on controller, webhook and (in agent mode) the node agent.
# No egress isolation: the API, CRI and gateway peers must remain reachable.
# API-server/kubelet source CIDRs are intentionally not guessed.
networkPolicy:
  enabled: true

# Metrics are unauthenticated HTTP; configure NetworkPolicy scrape selectors
# for your Prometheus namespace/pods before enabling monitors.
metrics:
  enabled: true
  # Only matching Namespace AND collector Pod labels may scrape metrics;
  # adjust both selectors to the installed Prometheus deployment.
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
  # Requires monitoring.coreos.com/v1 ServiceMonitor CRD when enabled.
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # Requires PodMonitor CRD; gateway namespaces must opt in with a label.
  podMonitor:
    enabled: false
    labels: {}
    namespaceSelector:
      matchLabels:
        ratatoskr.skaldhall.io/metrics: enabled
    interval: 30s
    scrapeTimeout: 10s
  dashboard:
    enabled: false
    sidecarLabel: grafana_dashboard
    sidecarValue: "1"
