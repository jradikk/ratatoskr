# M2 supports only the init driver and iproute datapath. Agent/eBPF are
# intentionally rejected at template time until their implementations ship.
image:
  registry: ghcr.io/skaldhall
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

driver: init
datapath: iproute

# Install into this namespace (defaults to Helm's release namespace). The
# bootstrap Secret and both webhook configurations are named by the chart.
operatorNamespace: ""
clusterDomain: cluster.local
fwmarkMask: "0x00f00000"

# Extra CIDRs excluded from client steering (also passed to the Go processes).
exclusions:
  serviceCIDRs: []
  extraCIDRs: []

controller:
  replicas: 1
  resources: {}
webhook:
  replicas: 1
  resources: {}

# These policies constrain incoming traffic; API-server/kubelet IPs cannot be
# reliably determined by a portable chart, so 9443 and health probes are open.
networkPolicy:
  enabled: true
