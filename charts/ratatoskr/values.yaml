# M5 defaults to the node agent; init is available for the local dev loop.
# eBPF is rejected at template time until M6.
image:
  registry: ghcr.io/skaldhall
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

driver: agent
datapath: iproute

agent:
  # Node-local CRI socket exposed to the DaemonSet, not to workloads/gateways.
  criSocket: /run/containerd/containerd.sock
  resources: {}

# Install into this namespace (defaults to Helm's release namespace). The
# bootstrap Secret and both webhook configurations are named by the chart.
operatorNamespace: ""
clusterDomain: cluster.local
dns:
  # External DNS questions from dns.mode=gateway go through upstream0 only.
  # Replace when a VPN provider requires a different accessible resolver.
  upstreamIP: "1.1.1.1"
fwmarkMask: "0x00f00000"

# CIDR overrides passed to the Go processes; podCIDRs may be left empty if
# the controller detects them from Node specs. Extra CIDRs bypass the gateway.
exclusions:
  serviceCIDRs: []
  podCIDRs: []
  extraCIDRs: []

controller:
  replicas: 1
  resources: {}
webhook:
  replicas: 1
  resources: {}

# These policies constrain incoming traffic; API-server/kubelet IPs cannot be
# reliably determined by a portable chart, so 9443 and health probes are open.
networkPolicy:
  enabled: true
