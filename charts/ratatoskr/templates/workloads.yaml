apiVersion: v1
kind: ServiceAccount
metadata:
  name: ratatoskr-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ratatoskr-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratatoskr-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ratatoskr.selectorLabels" (list . "controller") | nindent 8 }}
    spec:
      serviceAccountName: ratatoskr-controller
      containers:
        - name: controller
          image: {{ include "ratatoskr.image" (list . "controller") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.controller.leaderElection.enabled }}
          args: ["--leader-elect"]
          {{- end }}
          ports:
            - name: health
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8080
            {{- end }}
          env:
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_BIND_ADDRESS
              value: {{ ternary "0.0.0.0:8080" "0" .Values.metrics.enabled | quote }}
            - name: OPERATOR_NAMESPACE
              value: {{ default .Release.Namespace .Values.operatorNamespace | quote }}
            - name: DRIVER
              value: {{ .Values.driver | quote }}
            - name: DATAPATH
              value: {{ .Values.datapath | quote }}
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | quote }}
            - name: FWMARK_MASK
              value: {{ .Values.fwmarkMask | quote }}
            - name: SERVICE_CIDRS
              value: {{ join "," .Values.exclusions.serviceCIDRs | quote }}
            - name: POD_CIDRS
              value: {{ join "," .Values.exclusions.podCIDRs | quote }}
            - name: GATEWAY_UPSTREAM_DNS_IP
              value: {{ .Values.dns.upstreamIP | quote }}
            - name: GATEWAY_UPSTREAM_PROBE_URL
              value: {{ .Values.dns.upstreamProbeURL | quote }}
            - name: EXTRA_CIDRS
              value: {{ join "," .Values.exclusions.extraCIDRs | quote }}
            - name: GATEWAY_IMAGE
              value: {{ include "ratatoskr.image" (list . "gateway") | quote }}
            - name: OPENVPN_IMAGE
              value: {{ include "ratatoskr.image" (list . "upstream-openvpn") | quote }}
            - name: IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: GATEWAY_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: GATEWAY_METRICS_NAMESPACE_SELECTOR
              value: {{ toJson .Values.metrics.ingress.namespaceSelector | quote }}
            - name: GATEWAY_METRICS_POD_SELECTOR
              value: {{ toJson .Values.metrics.ingress.podSelector | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: ratatoskr-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ratatoskr.selectorLabels" (list . "controller") | nindent 4 }}
  ports:
    - name: health
      port: 8081
      targetPort: health
---
{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ratatoskr-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-metrics
spec:
  selector:
    {{- include "ratatoskr.selectorLabels" (list . "controller") | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratatoskr-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 8 }}
    spec:
      serviceAccountName: ratatoskr-webhook
      securityContext:
        # Both bootstrap and serving images run as distroless nonroot (UID 65532).
        # Kubelet makes the emptyDir group-writable; bootstrap creates a
        # private 0700 child directory owned by UID 65532 for TLS material.
        fsGroup: 65532
      initContainers:
        - name: bootstrap-tls
          image: {{ include "ratatoskr.image" (list . "webhook") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--bootstrap-tls", "--tls-dir=/tls/identity"]
          env:
            - name: SERVICE_NAME
              value: ratatoskr-webhook
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAMESPACE
              value: {{ default .Release.Namespace .Values.operatorNamespace | quote }}
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | quote }}
            - name: TLS_SECRET_NAME
              value: ratatoskr-webhook-tls
            - name: MUTATING_WEBHOOK_NAME
              value: ratatoskr-pods
            - name: VALIDATING_WEBHOOK_NAME
              value: ratatoskr-validation
          volumeMounts:
            - name: tls
              mountPath: /tls
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
      containers:
        - name: webhook
          image: {{ include "ratatoskr.image" (list . "webhook") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--tls-dir=/tls/identity"]
          ports:
            - name: https
              containerPort: 9443
            - name: health
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9904
            {{- end }}
          env:
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: METRICS_BIND_ADDRESS
              value: {{ ternary "0.0.0.0:9904" "0" .Values.metrics.enabled | quote }}
            - name: SERVICE_NAME
              value: ratatoskr-webhook
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAMESPACE
              value: {{ default .Release.Namespace .Values.operatorNamespace | quote }}
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | quote }}
            - name: TLS_SECRET_NAME
              value: ratatoskr-webhook-tls
            - name: MUTATING_WEBHOOK_NAME
              value: ratatoskr-pods
            - name: VALIDATING_WEBHOOK_NAME
              value: ratatoskr-validation
            - name: DRIVER
              value: {{ .Values.driver | quote }}
            - name: DATAPATH
              value: {{ .Values.datapath | quote }}
            - name: FWMARK_MASK
              value: {{ .Values.fwmarkMask | quote }}
            - name: SERVICE_CIDRS
              value: {{ join "," .Values.exclusions.serviceCIDRs | quote }}
            - name: EXTRA_CIDRS
              value: {{ join "," .Values.exclusions.extraCIDRs | quote }}
            - name: INIT_IMAGE
              value: {{ include "ratatoskr.image" (list . "init") | quote }}
            - name: INIT_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: ratatoskr-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: ratatoskr-webhook-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-metrics
spec:
  selector:
    {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 4 }}
  ports:
    - name: metrics
      port: 9904
      targetPort: metrics
{{- end }}
