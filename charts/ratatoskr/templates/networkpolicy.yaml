{{- if .Values.networkPolicy.enabled }}
# Portable NetworkPolicy only: ingress to webhook HTTPS and kubelet health
# probes; no dependency on host-network node selectors or CNI-specific APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratatoskr-webhook-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
{{- end }}
