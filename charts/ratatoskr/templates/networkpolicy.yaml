{{- if .Values.networkPolicy.enabled }}
# API-server and kubelet sources vary by cluster. Restrict ingress ports but
# do not guess source CIDRs or isolate egress to Kubernetes, CRI or VPN peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratatoskr-controller-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "controller") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8081
    {{- if .Values.metrics.enabled }}
    - {{- if or .Values.metrics.ingress.namespaceSelector .Values.metrics.ingress.podSelector }}
      from:
        - namespaceSelector: {{ toJson .Values.metrics.ingress.namespaceSelector }}
          podSelector: {{ toJson .Values.metrics.ingress.podSelector }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratatoskr-webhook-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "webhook") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
    {{- if .Values.metrics.enabled }}
    - {{- if or .Values.metrics.ingress.namespaceSelector .Values.metrics.ingress.podSelector }}
      from:
        - namespaceSelector: {{ toJson .Values.metrics.ingress.namespaceSelector }}
          podSelector: {{ toJson .Values.metrics.ingress.podSelector }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 9904
    {{- end }}
{{- if eq .Values.driver "agent" }}
---
# The node agent has an ordinary Pod network namespace; its only inbound
# listener is the configured health/readiness probe port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratatoskr-agent-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ratatoskr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ratatoskr.selectorLabels" (list . "agent") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.agent.healthPort }}
    {{- if .Values.metrics.enabled }}
    - {{- if or .Values.metrics.ingress.namespaceSelector .Values.metrics.ingress.podSelector }}
      from:
        - namespaceSelector: {{ toJson .Values.metrics.ingress.namespaceSelector }}
          podSelector: {{ toJson .Values.metrics.ingress.podSelector }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 9903
    {{- end }}
{{- end }}
{{- end }}
