# Helm values for the local k3d dev loop (make dev-deploy). Images are built
# locally and imported with `k3d image import`, never pulled.
image:
  registry: ghcr.io/skaldhall
  tag: dev
  pullPolicy: Never
driver: init
datapath: iproute
exclusions:
  # k3s defaults for this k3d flannel dev loop. The operator chart itself
  # leaves these empty for real clusters to discover/configure explicitly.
  serviceCIDRs:
    - 10.43.0.0/16
  podCIDRs:
    - 10.42.0.0/16
  extraCIDRs: []
