# k3d cluster config for the "calico" variant.
# No flannel, no k3s network policy; Calico is installed by hack/k3d-up.sh via the Tigera operator.
# Created/destroyed only through hack/k3d-up.sh / hack/k3d-down.sh, which also
# validate that the image below matches K3S_IMAGE in hack/versions.env.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ratatoskr-calico
servers: 1
agents: 2
image: rancher/k3s:v1.36.5-k3s1
kubeAPI:
  hostIP: 127.0.0.1
options:
  k3d:
    wait: true
    timeout: 300s
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --disable-network-policy
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
