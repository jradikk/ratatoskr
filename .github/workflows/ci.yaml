name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Shell syntax and helm lint
        run: |
          for f in hack/*.sh test/e2e/*/*.sh; do if [[ -f $f ]]; then bash -n "$f"; fi; done
          helm lint charts/ratatoskr
      - name: gofmt / go mod tidy clean
        run: |
          test -z "$(gofmt -s -l $(git ls-files '*.go'))"
          go mod tidy && git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        run: make test
      - name: Privileged tests (netns, netlink, nftables, BPF_PROG_TEST_RUN)
        run: |
          sudo modprobe -a geneve wireguard tun
          make test-privileged

  images:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing on tags
    strategy:
      fail-fast: false
      matrix:
        component: [controller, webhook, agent, gateway, init]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-arch image (push and sign only on tags)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/skaldhall/ratatoskr-${{ matrix.component }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          sbom: true
          provenance: mode=max
          push: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: sigstore/cosign-installer@v3
        if: github.ref_type == 'tag'
      - name: Sign image
        if: github.ref_type == 'tag'
        run: cosign sign --yes ghcr.io/skaldhall/ratatoskr-${{ matrix.component }}@${{ steps.build.outputs.digest }}
