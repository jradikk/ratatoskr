name: ci

on:
  push:
    branches: [main]
    # Version tags are handled by release.yaml, which calls this validation.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Shell syntax and helm lint
        run: |
          for f in hack/*.sh test/e2e/*/*.sh; do if [[ -f $f ]]; then bash -n "$f"; fi; done
          helm lint charts/ratatoskr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and validate chart security and packaging
        run: |
          python3 -m pip install PyYAML
          python3 charts/ratatoskr/tests/check_chart.py
      - name: gofmt / go mod tidy clean
        run: |
          test -z "$(gofmt -s -l $(git ls-files '*.go'))"
          go mod tidy && git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        run: make test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fixture and release workflow tests
        run: |
          python3 -m pip install PyYAML
          for suite in test/e2e/advanced test/e2e/matrix/synthetic test/e2e/m1 test/e2e/matrix test/e2e/platform test/e2e/release; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s "$suite" -p 'test_*.py'
          done
      - name: Privileged tests (netns, netlink, nftables, BPF_PROG_TEST_RUN)
        run: |
          sudo modprobe -a geneve wireguard tun
          make test-privileged

  images:
    # release.yaml builds and publishes all six images after these tests.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read # no package write or signing identity in CI
    strategy:
      fail-fast: false
      matrix:
        component: [controller, webhook, agent, gateway, init]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPONENT=${{ matrix.component }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: docker.io/${{ github.repository_owner }}/ratatoskr-${{ matrix.component }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
